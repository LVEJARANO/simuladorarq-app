<style>
    .sidebar {
    inline-size: 60px;  /* Ancho por defecto reducido */
    background: linear-gradient(135deg, #678ed6, #175597d1);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    transition: width 0.3s ease;  /* Transición para cambiar de tamaño */
    overflow: hidden;
    position: fixed;
    box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
    block-size: 100%;
    z-index: 1;
}
   /* Main content styling */
.main-content {
    margin-inline-start: 60px; /* Espacio cuando el sidebar está cerrado */
    transition: margin-left 0.3s ease;
    padding: 20px;
    flex-grow: 1;  /* Para que ocupe el espacio disponible */
}

   /* Ajuste cuando el sidebar está expandido */
.sidebar:hover + .main-content {
    margin-inline-start: 200px;
}
    /* Main content that shifts based on sidebar width */
    .main-content {
    margin-inline-start: 60px;  /* Espacio cuando el sidebar está cerrado */
    transition: margin-left 0.3s ease;
    padding: 20px;
   }
    /* Desplazamiento cuando el sidebar está expandido */
    .sidebar:hover + .main-content {
       margin-inline-start: 200px;  /* Ajusta este valor al ancho expandido del sidebar */
   }
